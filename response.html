<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TeamSyncの出欠回答ページです。" />
    <title>出欠を回答 | TeamSync</title>
    <link rel="stylesheet" href="css/style.css?v=11" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="TeamSync ホーム">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span>TeamSync</span>
      </a>
    </header>

    <main class="page-shell event-page-shell">
      <section id="event-loading" class="card event-state" aria-live="polite">
        <span class="event-loader" aria-hidden="true"></span>
        <p>イベント情報を読み込んでいます…</p>
      </section>

      <section id="event-error" class="card empty-state" aria-labelledby="event-error-title" hidden>
        <span class="calendar-icon calendar-icon--large" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M7 2v3M17 2v3M3.5 9h17M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" />
            <path d="m8 15 2.2 2.2L16.5 11" />
          </svg>
        </span>
        <p class="eyebrow">RESPONSE PAGE</p>
        <h1 id="event-error-title">回答画面を表示できません</h1>
        <p id="event-error-message" class="intro-copy"></p>
        <a class="secondary-button" href="index.html">新しいイベントを作成</a>
      </section>

      <article id="event-content" class="event-content" aria-labelledby="event-title" hidden>
        <section class="card event-summary response-event-summary">
          <div class="event-summary-heading">
            <div>
              <p class="eyebrow">EVENT</p>
              <h1 id="event-title"></h1>
            </div>
            <span class="event-candidate-badge" id="event-candidate-count"></span>
          </div>
          <p id="event-description" class="event-description"></p>
        </section>

        <section class="card event-dates" aria-labelledby="event-dates-title">
          <div class="event-section-heading">
            <div>
              <p class="step-label">YOUR RESPONSE</p>
              <h2 id="event-dates-title">出欠を回答</h2>
            </div>
            <p id="response-mode-hint">回答する候補だけ選択できます</p>
          </div>

          <form id="response-form" novalidate>
            <div class="response-name-group">
              <label for="participant-name">
                名前 <span class="required">*</span>
              </label>
              <input
                id="participant-name"
                name="participantName"
                type="text"
                maxlength="40"
                placeholder="例：たなか"
                autocomplete="name"
                aria-describedby="participant-name-hint participant-name-error"
                required
              />
              <div class="field-meta">
                <p id="participant-name-hint" class="field-hint">
                  既存回答の変更は、回答一覧の名前をクリックしてください
                </p>
                <p id="participant-name-count" class="character-count" aria-hidden="true">
                  0 / 40
                </p>
              </div>
              <p id="participant-name-error" class="field-error" aria-live="polite"></p>
            </div>

            <ol id="event-date-list" class="event-date-list"></ol>

            <p class="response-help">
              ○・△・×のいずれかを選んだ候補だけ保存されます。コメントは候補ごとに任意です。
            </p>
            <p id="response-form-error" class="field-error response-form-error" aria-live="polite"></p>

            <button class="primary-button" id="submit-response-button" type="submit">
              <span class="button-spinner" aria-hidden="true" hidden></span>
              <span id="submit-response-button-label">回答を保存</span>
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="m4 10 4 4 8-8" />
              </svg>
            </button>

            <p id="response-notice" class="phase-notice" role="status" aria-live="polite" hidden></p>
          </form>
        </section>

        <div class="event-page-actions">
          <a id="back-to-results-link" class="secondary-button" href="event.html">回答一覧に戻る</a>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <p>TeamSync <span aria-hidden="true">·</span> チームの日程調整をシンプルに</p>
    </footer>

    <script src="js/config.js?v=7" defer></script>
    <script src="js/supabase.js?v=8" defer></script>
    <script src="js/event.js?v=11" defer></script>
  </body>
</html>
