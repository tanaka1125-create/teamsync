<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TeamSyncは、ゲームチーム向けのシンプルな日程調整ツールです。"
    />
    <title>イベントを作成 | TeamSync</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="TeamSync ホーム">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span>TeamSync</span>
      </a>
    </header>

    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">SCHEDULE TOGETHER</p>
        <h1 id="page-title">みんなの予定を、ひとつに。</h1>
        <p class="intro-copy">
          候補日時を選んで共有するだけ。チームの日程調整を、かんたんに始められます。
        </p>
      </section>

      <section class="card" aria-labelledby="form-title">
        <div class="card-heading">
          <div>
            <p class="step-label">STEP 1</p>
            <h2 id="form-title">イベントを作成</h2>
          </div>
          <p class="required-note"><span aria-hidden="true">*</span> 必須項目</p>
        </div>

        <form id="create-event-form" novalidate>
          <div class="form-group">
            <label for="event-title">イベント名 <span class="required">*</span></label>
            <input
              id="event-title"
              name="title"
              type="text"
              maxlength="80"
              placeholder="例：8月のチーム練習"
              autocomplete="off"
              aria-describedby="event-title-hint event-title-error"
              required
            />
            <div class="field-meta">
              <p id="event-title-hint" class="field-hint">80文字以内で入力してください</p>
              <p id="event-title-count" class="character-count" aria-hidden="true">0 / 80</p>
            </div>
            <p id="event-title-error" class="field-error" aria-live="polite"></p>
          </div>

          <div class="form-group">
            <label for="event-description">
              説明 <span class="optional">任意</span>
            </label>
            <textarea
              id="event-description"
              name="description"
              rows="4"
              maxlength="500"
              placeholder="例：参加できる時間帯を教えてください"
              aria-describedby="event-description-hint"
            ></textarea>
            <div class="field-meta">
              <p id="event-description-hint" class="field-hint">参加者への補足があれば入力してください</p>
              <p id="event-description-count" class="character-count" aria-hidden="true">0 / 500</p>
            </div>
          </div>

          <fieldset class="form-group schedule-field" aria-describedby="schedule-note schedule-error">
            <legend>候補日時 <span class="required">*</span></legend>
            <div class="calendar" id="calendar" data-calendar>
              <div class="calendar-header">
                <button
                  class="calendar-nav-button"
                  id="calendar-previous"
                  type="button"
                  aria-label="前の月を表示"
                >
                  <svg viewBox="0 0 20 20" aria-hidden="true">
                    <path d="m12.5 4-6 6 6 6" />
                  </svg>
                </button>
                <p class="calendar-month" id="calendar-month" aria-live="polite"></p>
                <button
                  class="calendar-nav-button"
                  id="calendar-next"
                  type="button"
                  aria-label="次の月を表示"
                >
                  <svg viewBox="0 0 20 20" aria-hidden="true">
                    <path d="m7.5 4 6 6-6 6" />
                  </svg>
                </button>
              </div>

              <div class="calendar-weekdays" aria-hidden="true">
                <span class="is-sunday">日</span>
                <span>月</span>
                <span>火</span>
                <span>水</span>
                <span>木</span>
                <span>金</span>
                <span class="is-saturday">土</span>
              </div>

              <div
                class="calendar-grid"
                id="calendar-grid"
                role="group"
                aria-labelledby="calendar-month"
              ></div>

              <div class="calendar-selection" id="calendar-selection">
                <span class="calendar-selection-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <path d="M7 2v3M17 2v3M3.5 9h17M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" />
                    <path d="m8 15 2.2 2.2L16.5 11" />
                  </svg>
                </span>
                <div>
                  <span class="calendar-selection-label">選択中の日付</span>
                  <strong id="selected-date-label">日付を選択してください</strong>
                </div>
              </div>
            </div>
            <input id="selected-date" name="date" type="hidden" />
            <p id="schedule-note" class="field-hint schedule-hint">
              Phase 2では1日選択できます。複数候補と時刻は次のフェーズで追加します。
            </p>
            <p id="schedule-error" class="field-error" aria-live="polite"></p>
          </fieldset>

          <button class="primary-button" type="submit">
            <span>イベントを作成</span>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="m7 4 6 6-6 6" />
            </svg>
          </button>

          <p id="phase-notice" class="phase-notice" role="status" aria-live="polite" hidden></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>TeamSync <span aria-hidden="true">·</span> チームの日程調整をシンプルに</p>
    </footer>

    <script src="js/config.js" defer></script>
    <script src="js/calendar.js" defer></script>
    <script src="js/create-event.js" defer></script>
  </body>
</html>
