<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TeamSyncのイベント回答ページです。" />
    <title>イベント | TeamSync</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="TeamSync ホーム">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span>TeamSync</span>
      </a>
    </header>

    <main class="page-shell page-shell--centered">
      <section class="card empty-state" aria-labelledby="event-page-title">
        <span class="calendar-icon calendar-icon--large" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img">
            <path d="M7 2v3M17 2v3M3.5 9h17M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" />
            <path d="m8 15 2.2 2.2L16.5 11" />
          </svg>
        </span>
        <p class="eyebrow">EVENT PAGE</p>
        <h1 id="event-page-title">イベントページは準備中です</h1>
        <p class="intro-copy">
          出欠回答と集計機能は、後続フェーズで利用できるようになります。
        </p>
        <a class="secondary-button" href="index.html">イベント作成画面へ戻る</a>
      </section>
    </main>

    <footer class="site-footer">
      <p>TeamSync <span aria-hidden="true">·</span> チームの日程調整をシンプルに</p>
    </footer>

    <script src="js/config.js" defer></script>
    <script src="js/event.js" defer></script>
  </body>
</html>
