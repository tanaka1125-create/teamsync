<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TeamSyncのイベント専用ページです。" />
    <title>イベント | TeamSync</title>
    <link rel="stylesheet" href="css/style.css?v=5.1" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="TeamSync ホーム">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span>TeamSync</span>
      </a>
    </header>

    <main class="page-shell event-page-shell">
      <section id="event-loading" class="card event-state" aria-live="polite">
        <span class="event-loader" aria-hidden="true"></span>
        <p>イベント情報を読み込んでいます…</p>
      </section>

      <section id="event-error" class="card empty-state" aria-labelledby="event-error-title" hidden>
        <span class="calendar-icon calendar-icon--large" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M7 2v3M17 2v3M3.5 9h17M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" />
            <path d="m8 15 2.2 2.2L16.5 11" />
          </svg>
        </span>
        <p class="eyebrow">EVENT PAGE</p>
        <h1 id="event-error-title">イベントを表示できません</h1>
        <p id="event-error-message" class="intro-copy"></p>
        <a class="secondary-button" href="index.html">新しいイベントを作成</a>
      </section>

      <article id="event-content" class="event-content" aria-labelledby="event-title" hidden>
        <section class="card event-summary">
          <div class="event-summary-heading">
            <div>
              <p class="eyebrow">EVENT</p>
              <h1 id="event-title"></h1>
            </div>
            <span class="event-candidate-badge" id="event-candidate-count"></span>
          </div>
          <p id="event-description" class="event-description"></p>

          <div class="share-panel">
            <div>
              <span class="share-label">イベント専用URL</span>
              <p id="share-url" class="share-url"></p>
            </div>
            <button id="copy-url-button" class="copy-button" type="button">
              <svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="6" y="6" width="10" height="10" rx="2" />
                <path d="M13 6V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1" />
              </svg>
              <span id="copy-url-label">URLをコピー</span>
            </button>
          </div>
          <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
        </section>

        <section class="card event-dates" aria-labelledby="event-dates-title">
          <div class="event-section-heading">
            <div>
              <p class="step-label">SCHEDULE</p>
              <h2 id="event-dates-title">候補日時</h2>
            </div>
            <p>出欠回答はPhase 6で追加します</p>
          </div>
          <ol id="event-date-list" class="event-date-list"></ol>
        </section>

        <div class="event-page-actions">
          <a class="secondary-button" href="index.html">新しいイベントを作成</a>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <p>TeamSync <span aria-hidden="true">·</span> チームの日程調整をシンプルに</p>
    </footer>

    <script src="js/config.js?v=5.1" defer></script>
    <script src="js/supabase.js?v=5.1" defer></script>
    <script src="js/event.js?v=5.1" defer></script>
  </body>
</html>
